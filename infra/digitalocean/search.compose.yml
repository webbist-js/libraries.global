name: libraries-global-search

services:
  meilisearch:
    image: ${MEILI_IMAGE:?Set a pinned Meilisearch image digest}
    restart: unless-stopped
    user: "1000:1000"
    env_file: search.env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: "1536 MiB"
      MEILI_MAX_INDEXING_THREADS: "2"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - ./meili_data:/meili_data
    mem_limit: 3g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  private-proxy:
    image: ${CADDY_IMAGE:?Set a pinned Caddy image digest}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./search.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      meilisearch:
        condition: service_healthy
    # The official Caddy binary carries this file capability; its execution
    # requires the capability to remain in the container's bounding set.
    cap_add:
      - NET_BIND_SERVICE
