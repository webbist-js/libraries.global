name: libraries-global-web

services:
  gateway:
    image: caddy@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    network_mode: host
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/${WEB_MODE:-preview}.Caddyfile
      - --adapter
      - caddyfile
    volumes:
      - ./web:/etc/caddy:ro
      - ./web/site:/srv:ro
      - web-data:/data
      - web-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  web-data:
  web-config:
