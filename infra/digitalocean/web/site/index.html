<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Libraries Global — Preparing to launch</title>
    <link rel="icon" href="/favicon.svg?v=globe-1" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f8f7f3;
        color: #252a28;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(32rem, calc(100% - 3rem));
        padding: 3rem 0;
      }
      img {
        width: 3rem;
        height: 3rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 650;
        letter-spacing: -0.04em;
        line-height: 1.1;
        margin: 0 0 1.25rem;
      }
      p {
        color: #535d58;
        font-size: 1.125rem;
        line-height: 1.6;
        max-width: 28rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Libraries Global</h1>
      <p>
        We're preparing the library atlas for launch. Please check back soon.
      </p>
    </main>
  </body>
</html>
