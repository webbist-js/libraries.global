name: CI

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  # Build/test fixture only; deployment supplies its own runtime secret.
  BETTER_AUTH_SECRET: dummy-ci-secret-not-for-runtime-only

jobs:
  native_analysis:
    name: Native analysis checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check density tile validation
        run: python3 -m unittest discover -s qa/benchmarks/atlas -p 'test_validate_density.py'
      - name: Build and test the isolated native runtime
        run: docker build --tag atlas-analysis-ci apps/analysis

  build_and_verify:
    name: Install, Lint, Test and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Prepare Environment Variables
        run: |
          cp apps/strapi/.env.example apps/strapi/.env
          cp apps/ui/.env.local.example apps/ui/.env.local

      # Workspace exports point to dist files; clean runners have no local dev artifacts.
      - name: Build workspace libraries
        run: pnpm exec turbo run build --filter='./packages/*' --concurrency=1

      - name: Run linter
        run: pnpm lint:ratchet

      - name: Check css/md formatting
        run: pnpm format:check

      - name: Reject private operational files
        run: node scripts/release/check-public-files.mjs

      - name: Verify release source guards
        run: |
          pnpm exec eslint scripts/release/*.mjs
          node --test scripts/release/*.test.mjs scripts/atlas/*.test.mjs
          python3 -m unittest discover -s scripts/release -p 'test_*.py'

      # Includes the @repo/access type-level invariants and the Strapi unit
      # suite (test:unit). Strapi's tests/app.test.ts boots a real Strapi on
      # Postgres, so it stays out of CI and runs locally with pnpm test:strapi.
      - name: Run unit tests
        run: pnpm test:ci

      - name: Build UI
        run: |
          rm -rf apps/ui/.next
          pnpm build:ui

      - name: Typecheck UI including tests
        run: pnpm --filter @repo/ui typecheck

      - name: Install Chromium for public smoke checks
        run: pnpm --filter @repo/tests-playwright exec playwright install --with-deps chromium

      - name: Check hydrated public page shells and Events search
        env:
          QA_SMOKE: "1"
        run: pnpm --filter @repo/tests-playwright exec playwright test --project=smoke

      - name: Typecheck Strapi admin plugins
        run: pnpm --filter @repo/strapi exec tsc -p tsconfig.admin.json

      - name: Build Strapi
        run: pnpm build:strapi
