name: Production images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-images
  cancel-in-progress: false

jobs:
  build:
    # Configure the protected environment and its scoped registry credential
    # before enabling this variable. PRs and forks never publish images.
    if: github.repository == 'webbist-js/libraries.global' && github.ref == 'refs/heads/dev' && vars.DO_IMAGE_PUBLISH_ENABLED == 'true'
    environment: production-images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REGISTRY: ${{ secrets.DO_CONTAINER_REGISTRY }}
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the protected source and successful checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-release-source.mjs

      - name: Install the scoped registry login
        env:
          DO_REGISTRY_USERNAME: ${{ secrets.DO_REGISTRY_USERNAME }}
          DO_REGISTRY_TOKEN: ${{ secrets.DO_REGISTRY_TOKEN }}
        run: node scripts/release/registry-auth.mjs

      - name: Build and publish immutable image references
        run: |
          set -euo pipefail
          for service in ui strapi worker; do
            app="$service"
            if [ "$service" = worker ]; then app=sync-worker; fi
            image="$REGISTRY/$service:git-$GITHUB_SHA"
            docker build --platform linux/amd64 \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/webbist-js/libraries.global" \
              --file "apps/$app/Dockerfile" --tag "$image" .
            docker push "$image"
            docker image inspect --format '{{index .RepoDigests 0}}' "$image" > "$RUNNER_TEMP/$service.image"
          done
          node scripts/release/image-manifest.mjs

      - name: Save the credential-free release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-images-${{ github.sha }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove registry credentials
        if: always()
        run: |
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
