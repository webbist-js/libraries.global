<!DOCTYPE html>
<html lang="en"><head><title>Pride and prejudice - Barnet Libraries</title></head>
<body>
<div id="availability">
  <h2>Availability</h2>
  <ul class="options">
    <li>
      <h3><span class="libraryName"><span>Chipping Barnet Library</span></span> <span class="count">(2 copies)</span></h3>
      <div class="jsHidden">
        <table><thead><tr><th>Shelfmark</th><th>Status</th></tr></thead>
          <tbody>
            <tr itemscope itemtype="http://schema.org/Offer"><td>F AUS</td><td><link itemprop="availability" href="http://schema.org/InStock" />Available</td></tr>
            <tr itemscope itemtype="http://schema.org/Offer"><td>F AUS</td><td><link itemprop="availability" href="http://schema.org/OutOfStock" />On loan</td></tr>
          </tbody>
        </table>
      </div>
    </li>
    <li>
      <h3><span class="libraryName"><span>Hendon Library</span></span> <span class="count">(3 copies)</span></h3>
      <div class="jsHidden">
        <table><thead><tr><th>Shelfmark</th><th>Status</th></tr></thead>
          <tbody>
            <tr itemscope itemtype="http://schema.org/Offer"><td>F AUS</td><td><link itemprop="availability" href="http://schema.org/InStoreOnly" />Reference only</td></tr>
            <tr itemscope itemtype="http://schema.org/Offer"><td>F AUS</td><td><link itemprop="availability" href="http://schema.org/OutOfStock" />On loan</td></tr>
            <tr itemscope itemtype="http://schema.org/Offer"><td>F AUS</td><td>On shelf</td></tr>
          </tbody>
        </table>
      </div>
    </li>
  </ul>
</div>
</body></html>
